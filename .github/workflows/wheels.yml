name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: Wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Install Boost (macOS)
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Cache Boost headers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/boost_1_90_0
          key: boost-headers-1.90.0-v2-windows

      - name: Install Boost headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "$env:RUNNER_TEMP/boost_1_90_0")) {
            Invoke-WebRequest `
              https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2 `
              -OutFile "$env:RUNNER_TEMP/boost.tar.bz2"
            tar -xjf "$env:RUNNER_TEMP/boost.tar.bz2" -C "$env:RUNNER_TEMP"
            # CMake find_package(Boost) expects $BOOST_ROOT/include/boost/
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/boost_1_90_0/include"
            Move-Item "$env:RUNNER_TEMP/boost_1_90_0/boost" "$env:RUNNER_TEMP/boost_1_90_0/include/boost"
          }
          "BOOST_ROOT=$env:RUNNER_TEMP/boost_1_90_0" >> $env:GITHUB_ENV
          "BOOST_INCLUDEDIR=$env:RUNNER_TEMP/boost_1_90_0/include" >> $env:GITHUB_ENV

      - name: Build wheels
        run: |
          python -m pip install cibuildwheel
          cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BEFORE_ALL_LINUX: bash ci/build-boost.sh
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_WINDOWS: "AMD64"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  release:
    needs: wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          merge-multiple: true

      - name: Create release with wheels
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl

name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: Wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-13, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Boost (macOS)
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Cache Boost headers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/boost_1_90_0
          key: boost-headers-1.90.0-windows

      - name: Install Boost headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "$env:RUNNER_TEMP/boost_1_90_0")) {
            Invoke-WebRequest `
              https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2 `
              -OutFile "$env:RUNNER_TEMP/boost.tar.bz2"
            tar -xjf "$env:RUNNER_TEMP/boost.tar.bz2" -C "$env:RUNNER_TEMP"
          }
          "BOOST_ROOT=$env:RUNNER_TEMP/boost_1_90_0" >> $env:GITHUB_ENV
          "BOOST_INCLUDEDIR=$env:RUNNER_TEMP/boost_1_90_0" >> $env:GITHUB_ENV

      - name: Build wheels
        run: |
          python -m pip install cibuildwheel
          cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BEFORE_ALL_LINUX: bash ci/build-boost.sh

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

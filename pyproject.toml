[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ur-rtde-py"
version = "1.6.5"
description = "A Python interface for controlling and receiving data from a UR robot using the Real-Time Data Exchange (RTDE) interface of the robot."
readme = "USER_GUIDE.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anders Prier Lindvig", email = "anpl@mmmi.sdu.dk" }]
maintainers = [{ name = "Anders Prier Lindvig", email = "anpl@mmmi.sdu.dk" }]
requires-python = ">=3.10"
dependencies = ["nanobind-backend>=1.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://sdurobotics.gitlab.io/ur_rtde/"

[tool.scikit-build]
minimum-version = "0.11"
build-dir = "build/{wheel_tag}"
cmake.define = { EXAMPLES = "OFF", BUILD_STATIC = "ON" }
# Split-mode stable ABI: one wheel per platform, usable on Python >= 3.10.
wheel.py-api = "cp310"

[tool.cibuildwheel]
build = "cp310-*"
test-import = "rtde_control"
